name: cd

on:
  push:
    branches: [main]

jobs:
  Deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6
      - name: Set up GO toolchain
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
      - name: Build the app with PROD variables
        run: (./scripts/buildprod.sh)
