name: ci

on:
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up GO
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
      - name: Unit tests for GetAPIKey with CODE Coverage
        run: (go test ./internal/auth/ -cover)

      - name: Exit with code 0
        run: (exit 0)
jobs:
  style:
    name: Style
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6
      - name: Set UP GO
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
      - name: Check Formatting and format text.
        run: (test -z $(go fmt .)
      - name: Exit with 0
        run: (exit 0)

