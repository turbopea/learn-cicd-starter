name: ci

on:
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up GO
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"

      - name: Go version
        run: (go test ../../auth/internal/)

      - name: Exit with code 0
        run: (exit 0)

